model:
  _target_: gabbro.models.vqvae.VQVAELightning
  model_type: VQVAETransformer
  model_kwargs:
    hidden_dim: 128
    latent_dim: 8
    num_blocks: 4
    num_heads: 8
    alpha: 10
    vq_kwargs:
      num_codes: 8192
      beta: 0.9
      kmeans_init: false
      norm: null
      cb_norm: null
      affine_lr: 2
      sync_nu: 1
      replace_freq: 500
      dim: -1
    old_transformer_implementation: false
    in_out_proj_cfg: null
    latent_proj_cfg: null
    input_features_dict:
      part_pt:
        multiply_by: 1
        subtract_by: 1.8
        func: signed_log
        inv_func: signed_exp
      part_etarel:
        multiply_by: 3
      part_phirel:
        multiply_by: 3
    causal_decoder: true
    conditional_dim: 0
    max_sequence_len: 128
    transformer_cfg:
      attn_cfg:
        num_heads: 8
        dropout_rate: 0.0
        norm_before: true
        norm_after: false
      mlp_cfg:
        expansion_factor: 4
        dropout_rate: 0.0
        norm_before: true
        activation: GELU
      residual_cfg:
        gate_type: local
        init_value: 1.0
  optimizer:
    _target_: gabbro.utils.optimizer.ranger.Ranger
    _partial_: true
    lr: 0.001
    weight_decay: 0.01
    betas:
    - 0.95
    - 0.999
    eps: 1.0e-05
  scheduler:
    _target_: torch.optim.lr_scheduler.ConstantLR
    _partial_: true
    total_iters: 1
    factor: 1
  model_kwargs_loaded: null
  scheduler_lightning_kwargs:
    monitor: val_loss
    interval: step
    frequency: 1
