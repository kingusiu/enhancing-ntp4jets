# Save the model periodically by monitoring a quantity.
# Look at the above link for more detailed information.
model_checkpoint:
  _target_: gabbro.callbacks.checkpoint_callback.CustomModelCheckpoint
  state_key: "General-checkpoint-callback"
  dirpath: null # directory to save the model file
  filename: "epoch_{epoch:03d}_step_{step}"
  monitor: "val_loss" # name of the logged metric which determines when model is improving
  verbose: true # verbosity mode
  save_last: true # unconditionally save last.ckpt every every_n_train_steps, even if val_loss hasn't been logged yet
  save_top_k: 5 # save k best models (determined by above metric)
  mode: "min" # "max" means higher metric value is better, can be also "min"
  auto_insert_metric_name: true # when True, the checkpoints filenames will contain the metric name
  save_weights_only: false # if True, then only the model’s weights will be saved
  every_n_train_steps: 10000 # number of training steps between checkpoints
  train_time_interval: null # checkpoints are monitored at the specified time interval
  every_n_epochs: null # mutually exclusive with every_n_train_steps, must be null/0 when the latter is set
  save_on_train_epoch_end: null # whether to run checkpointing at the end of the training epoch or the end of validation
